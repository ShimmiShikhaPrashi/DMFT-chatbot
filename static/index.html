<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DMFT Assistant</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 450px;
            max-width: 95%;
            height: 650px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: #1b5e20;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h2 {
            margin-bottom: 5px;
        }

        .header p {
            font-size: 13px;
            opacity: 0.9;
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
        }

        .bot-message {
            justify-content: flex-start;
        }

        .user-message {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 80%;
            padding: 12px 15px;
            border-radius: 15px;
            line-height: 1.5;
            white-space: pre-line;
        }

        .bot-message .bubble {
            background: #e9ecef;
            color: #333;
            border-bottom-left-radius: 3px;
        }

        .user-message .bubble {
            background: #1b5e20;
            color: white;
            border-bottom-right-radius: 3px;
        }

        .quick-options {
            padding: 10px 20px;
            background: white;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .quick-options button {
            border: none;
            background: #e8f5e9;
            color: #1b5e20;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
        }

        .quick-options button:hover {
            background: #c8e6c9;
        }

        .input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid #ddd;
            background: white;
        }

        #messageInput {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 25px;
            outline: none;
        }

        #sendButton {
            margin-left: 10px;
            border: none;
            background: #1b5e20;
            color: white;
            width: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }

        #sendButton:hover {
            background: #2e7d32;
        }

        @media (max-width: 500px) {
            .chat-container {
                height: 100vh;
                max-width: 100%;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

<div class="chat-container">

    <div class="header">
        <h2>🤖 DMFT Assistant</h2>
        <p>District Mineral Foundation Trust</p>
    </div>

    <div class="chat-box" id="chatBox">

        <div class="message bot-message">
            <div class="bubble">
👋 Welcome to DMFT Assistant!

I can help you with:
• About DMFT
• Schemes & Benefits
• DMFT Projects
• Grievances

नमस्कार! मैं DMFT से संबंधित जानकारी में आपकी सहायता कर सकता हूँ।
            </div>
        </div>

    </div>

    <div class="quick-options">
        <button onclick="sendQuickMessage('What is DMFT?')">
            About DMFT
        </button>

        <button onclick="sendQuickMessage('DMFT schemes')">
            Schemes
        </button>

        <button onclick="sendQuickMessage('DMFT projects')">
            Projects
        </button>

        <button onclick="sendQuickMessage('Register grievance')">
            Grievance
        </button>
    </div>

    <div class="input-area">

        <input
            type="text"
            id="messageInput"
            placeholder="Ask something about DMFT..."
        >

        <button id="sendButton" onclick="sendMessage()">
            ➤
        </button>

    </div>

</div>


<script>

const chatBox = document.getElementById("chatBox");
const messageInput = document.getElementById("messageInput");


function addMessage(message, sender) {

    const messageDiv = document.createElement("div");

    messageDiv.classList.add("message");

    if (sender === "user") {
        messageDiv.classList.add("user-message");
    } else {
        messageDiv.classList.add("bot-message");
    }

    const bubble = document.createElement("div");

    bubble.classList.add("bubble");

    bubble.innerText = message;

    messageDiv.appendChild(bubble);

    chatBox.appendChild(messageDiv);

    chatBox.scrollTop = chatBox.scrollHeight;
}


async function sendMessage() {

    const message = messageInput.value.trim();

    if (!message) return;

    addMessage(message, "user");

    messageInput.value = "";

    try {

        const response = await fetch("/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message
            })

        });

        const data = await response.json();

        addMessage(data.bot_response, "bot");

    } catch (error) {

        addMessage(
            "Sorry, there was an error connecting to the DMFT server.",
            "bot"
        );

    }

}


function sendQuickMessage(message) {

    messageInput.value = message;

    sendMessage();

}


messageInput.addEventListener("keypress", function(event) {

    if (event.key === "Enter") {

        sendMessage();

    }

});

</script>

</body>
</html>
